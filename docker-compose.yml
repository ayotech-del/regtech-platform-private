services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: regtech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Host port 5434, not 5432: this machine already has native Windows
      # postgresql-x64-15/16 services bound to 5432.
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
